<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video Task Instructions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      line-height: 1.65;
      background: #111;
      color: #e8e8e8;

      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    .section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
    }

    .label {
      display: inline-block;
      background: #f59e0b;
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 4px 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .keywords { list-style: none; padding: 0; }
    .keywords li {
      font-size: 1.15rem;
      padding: 6px 0;
      border-bottom: 1px solid #2a2a2a;
      font-weight: 500;
    }
    .keywords li:last-child { border-bottom: none; }

    .thumb-wrap {
      margin-top: 12px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #333;
      display: inline-block;
    }
    .thumb-wrap img {
      display: block;
      max-width: 100%;
      height: auto;
      pointer-events: none;
    }
    .channel-name { margin-top: 10px; font-size: 1rem; color: #ccc; }
    .channel-name strong { color: #fff; }

    .steps { counter-reset: step; list-style: none; padding: 0; }
    .steps li {
      counter-increment: step;
      position: relative;
      padding: 12px 0 12px 48px;
      border-bottom: 1px solid #222;
      font-size: 1rem;
    }
    .steps li:last-child { border-bottom: none; }
    .steps li::before {
      content: counter(step);
      position: absolute;
      left: 0; top: 12px;
      width: 32px; height: 32px;
      background: #f59e0b;
      color: #000;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .val {
      display: inline-block;
      background: #f59e0b22;
      border: 1px solid #f59e0b66;
      color: #f59e0b;
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 4px;
      font-family: "SF Mono", "Fira Code", monospace;
    }

    .meta { font-size: 0.8rem; color: #555; margin-top: 20px; text-align: center; }

    .warning {
      background: #7f1d1d44;
      border: 1px solid #dc262655;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 12px;
      font-size: 0.9rem;
      color: #fca5a5;
    }
  </style>
</head>

<body oncontextmenu="return false"
      onselectstart="return false"
      ondragstart="return false">

  <div id="content">Loading…</div>

  <script>
    document.addEventListener("copy", e => e.preventDefault());
    document.addEventListener("keydown", function (e) {
      const ctrl = navigator.platform.toUpperCase().includes("MAC") ? e.metaKey : e.ctrlKey;
      if (ctrl && ["c", "x", "a"].includes(e.key.toLowerCase())) e.preventDefault();
    });

    // ╔══════════════════════════════════════════════════════════════════╗
    // ║  EDIT THIS CONFIG BLOCK FOR EACH NEW CAMPAIGN                  ║
    // ╚══════════════════════════════════════════════════════════════════╝

    const CONFIG = {

      // ── Keywords (workers search one of these on YouTube) ──
      keywords: [
        "surfshark coupon code",
        "surfshark coupon code 2026",
        "surfshark discount code",
      ],

      // ── Thumbnail URL ──
      thumbnailUrl: "https://i.postimg.cc/7LqThgzj/mqdefault-(12).jpg",

      // ── Channel name shown to workers ──
      channelName: "TrickFox",

      // ── Video duration in SECONDS ──
      videoDurationSeconds: 182,

      // ── Minimum watch time in MINUTES ──
      // If video is SHORTER than this → "watch the entire video"
      // If video is LONGER  than this → "watch for at least X minutes"
      minWatchMinutes: 3,

      // ── How many times workers must watch ──
      watchCount: 1,

      // ── Text proof question (leave "" to skip) ──
      proofQuestion: "",

      // ── Video title (footer reference only) ──
      videoTitle: "",
    };

    // ╔══════════════════════════════════════════════════════════════════╗
    // ║  DO NOT EDIT BELOW                                             ║
    // ╚══════════════════════════════════════════════════════════════════╝

    function render(c) {
      const fps = 60;
      const minWatchSeconds = c.minWatchMinutes * 60;
      const isShortVideo = c.videoDurationSeconds <= minWatchSeconds;

      const requiredWatchSeconds = isShortVideo ? c.videoDurationSeconds : minWatchSeconds;
      const frameThreshold = requiredWatchSeconds * fps * c.watchCount;

      const kwListHtml = c.keywords.map(k => `<li>${k}</li>`).join("");
      const fmtTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

      let watchText;
      if (isShortVideo) {
        watchText = `Watch the <strong>entire video</strong> (${fmtTime(c.videoDurationSeconds)}).`;
      } else {
        watchText = `Watch the video for at least <strong>${c.minWatchMinutes} minutes</strong>.`;
      }

      let warningTime;
      if (isShortVideo) {
        warningTime = fmtTime(c.videoDurationSeconds);
      } else {
        warningTime = `${c.minWatchMinutes} minute${c.minWatchMinutes > 1 ? "s" : ""}`;
      }

      let steps = [];

      steps.push(
        `Search for one of the keywords above on <strong>YouTube</strong>.`
      );

      steps.push(
        `Find the video with the thumbnail shown above from <strong>${c.channelName}</strong> and click it.`
      );

      steps.push(
        `Right-click on the video player and enable <strong>"Stats for nerds"</strong> before pressing play.`
      );

      steps.push(
        `${watchText} Your "Stats for nerds" frame count must be over: <span class="val">${frameThreshold.toLocaleString()}</span>`
      );

      if (c.watchCount >= 2) {
        const frameTwice = requiredWatchSeconds * fps * 2;
        steps.push(
          `Rewatch by moving the timestamp back to the beginning. Total frame count must be over: <span class="val">${frameTwice.toLocaleString()}</span>`
        );
      }

      if (c.proofQuestion) {
        steps.push(
          `In the proof section, answer: <strong>"${c.proofQuestion}"</strong> — then upload screenshots as required.`
        );
      } else {
        steps.push(
          `Upload all required screenshots as proof.`
        );
      }

      const stepsHtml = steps.map(s => `<li>${s}</li>`).join("");

      document.getElementById("content").innerHTML = `
        <div class="section">
          <span class="label">Search for one of these keywords on YouTube:</span>
          <ul class="keywords">${kwListHtml}</ul>
        </div>

        <div class="section">
          <span class="label">Look for this thumbnail in the search results:</span>
          <div class="thumb-wrap">
            <img src="${c.thumbnailUrl}" alt="Video thumbnail" />
          </div>
          <p class="channel-name">YT Channel: <strong>${c.channelName}</strong></p>
        </div>

        <div class="section">
          <span class="label">Instructions:</span>
          <ol class="steps">${stepsHtml}</ol>
          <div class="warning">
            ⚠ If you watch less than ${warningTime}, you will not be paid.
          </div>
        </div>

        <p class="meta">${c.videoTitle} · ${fmtTime(c.videoDurationSeconds)}</p>
      `;
    }

    render(CONFIG);
  </script>
</body>
</html>
