<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Video Task Instructions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px; margin: 0 auto; padding: 24px 16px 48px;
      line-height: 1.65; background: #111; color: #e8e8e8;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    }
    .section { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
    .label {
      display: inline-block; background: #f59e0b; color: #000; font-weight: 700;
      font-size: 0.95rem; padding: 4px 12px; border-radius: 4px; margin-bottom: 12px;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .keywords { list-style: none; padding: 0; }
    .keywords li { font-size: 1.15rem; padding: 6px 0; border-bottom: 1px solid #2a2a2a; font-weight: 500; }
    .keywords li:last-child { border-bottom: none; }
    .thumb-wrap { margin-top: 12px; border-radius: 10px; overflow: hidden; border: 2px solid #333; display: inline-block; max-width: 300px; }
    .thumb-wrap img { display: block; max-width: 100%; height: auto; pointer-events: none; }
    .channel-name { margin-top: 10px; font-size: 1rem; color: #ccc; }
    .channel-name strong { color: #fff; }
    .steps { counter-reset: step; list-style: none; padding: 0; }
    .steps li {
      counter-increment: step; position: relative; padding: 12px 0 12px 48px;
      border-bottom: 1px solid #222; font-size: 1rem;
    }
    .steps li:last-child { border-bottom: none; }
    .steps li::before {
      content: counter(step); position: absolute; left: 0; top: 12px;
      width: 32px; height: 32px; background: #f59e0b; color: #000;
      font-weight: 700; font-size: 0.95rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .val {
      display: inline-block; background: rgba(245,158,11,0.13);
      border: 1px solid rgba(245,158,11,0.4); color: #f59e0b;
      font-weight: 700; padding: 1px 8px; border-radius: 4px;
      font-family: "SF Mono", "Fira Code", monospace;
    }
    .meta { font-size: 0.8rem; color: #555; margin-top: 20px; text-align: center; }
    .warning {
      background: #7f1d1d44; border: 1px solid #dc262655; border-radius: 8px;
      padding: 12px 16px; margin-top: 12px; font-size: 0.9rem; color: #fca5a5;
    }
  </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">
  <div id="content">Loading…</div>
  <script>
    document.addEventListener("copy",function(e){e.preventDefault();});
    document.addEventListener("keydown",function(e){
      var ctrl=navigator.platform.toUpperCase().includes("MAC")?e.metaKey:e.ctrlKey;
      if(ctrl&&["c","x","a"].includes(e.key.toLowerCase()))e.preventDefault();
    });

    var INSTR = {"search":"Search for one of the keywords above on <strong>YouTube</strong>.","find":"Find the video with the thumbnail shown above from <strong>{channel}</strong> and click it.","stats":"Right-click on the video player and enable <strong>“Stats for nerds”</strong> before pressing play.","like":"","comment":"","proof":"Upload all required screenshots as proof."};

    var ALL_VIDEOS = [
      {
        "keywords": [
          "Granola AI tutorial",
          "Granola AI for beginners"
        ],
        "thumbnailUrl": "https://i.postimg.cc/tTyK6rnj/maxresdefault-(1).webp",
        "channelName": "Automation Stack",
        "videoDurationSeconds": 1000,
        "minWatchMinutes": 5,
        "watchCount": 1,
        "watchEntirely": false,
        "weight": 1,
        "proofQuestion": "",
        "videoTitle": ""
      },
      {
        "keywords": [
          "Granola MCP",
          "Granola MCP tutorial"
        ],
        "thumbnailUrl": "https://i.postimg.cc/1tPkFWVh/maxresdefault-(2).webp",
        "channelName": "Automation Stack",
        "videoDurationSeconds": 1000,
        "minWatchMinutes": 5,
        "watchCount": 1,
        "watchEntirely": false,
        "weight": 1,
        "proofQuestion": "",
        "videoTitle": ""
      },
      {
        "keywords": [
          "how to use Granola AI",
          "Granola AI app",
          "Granola AI meeting notes"
        ],
        "thumbnailUrl": "https://i.postimg.cc/V61xt701/mqdefault-(2).webp",
        "channelName": "Automation Stack",
        "videoDurationSeconds": 1000,
        "minWatchMinutes": 5,
        "watchCount": 1,
        "watchEntirely": false,
        "weight": 1,
        "proofQuestion": "",
        "videoTitle": ""
      },
      {
        "keywords": [
          "systeme io tutorial",
          "systeme.io tutorial for beginners"
        ],
        "thumbnailUrl": "https://i.postimg.cc/VvjbK65S/mqdefault-(1).webp",
        "channelName": "Tutorial Stack",
        "videoDurationSeconds": 1000,
        "minWatchMinutes": 5,
        "watchCount": 1,
        "watchEntirely": false,
        "weight": 0.6,
        "proofQuestion": "",
        "videoTitle": ""
      },
      {
        "keywords": [
          "How To Generate AI Images With OpenArt",
          "openart ai image generation"
        ],
        "thumbnailUrl": "https://i.postimg.cc/KjN8KgR0/maxresdefault-(1).webp",
        "channelName": "Tutorial Stack",
        "videoDurationSeconds": 1000,
        "minWatchMinutes": 5,
        "watchCount": 1,
        "watchEntirely": false,
        "weight": 0.2,
        "proofQuestion": "",
        "videoTitle": ""
      },
      {
        "keywords": [
          "openart ai tutorial",
          "openart ai tutorial for beginners"
        ],
        "thumbnailUrl": "https://i.postimg.cc/QC0jNGz3/maxresdefault-(2).webp",
        "channelName": "Tutorial Stack",
        "videoDurationSeconds": 1000,
        "minWatchMinutes": 5,
        "watchCount": 1,
        "watchEntirely": false,
        "weight": 0.6,
        "proofQuestion": "",
        "videoTitle": ""
      }
    ];
    var tw=0,i;
    for(i=0;i<ALL_VIDEOS.length;i++)tw+=(ALL_VIDEOS[i].weight||1);
    var r=Math.random()*tw,cum=0,c=ALL_VIDEOS[ALL_VIDEOS.length-1];
    for(i=0;i<ALL_VIDEOS.length;i++){cum+=(ALL_VIDEOS[i].weight||1);if(r<cum){c=ALL_VIDEOS[i];break;}}

    (function render(c){
      var fps=60,dSec=c.videoDurationSeconds,minSec=c.minWatchMinutes*60;
      var isEntire=c.watchEntirely||(dSec<=minSec);
      var reqSec=isEntire?dSec:minSec;
      var wc=Math.max(1,c.watchCount||1);
      var firstFrames=reqSec*fps;
      var kwH=c.keywords.filter(function(k){return k.trim();}).map(function(k){return"<li>"+k+"</li>";}).join("");
      var fmt=function(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
      var wt=isEntire?"Watch the <strong>entire video</strong> ("+fmt(dSec)+").":"Watch the video for at least <strong>"+c.minWatchMinutes+" minutes</strong>.";
      var wn=isEntire?fmt(dSec):c.minWatchMinutes+" minute"+(c.minWatchMinutes>1?"s":"");
      var st=[];
      st.push(INSTR.search);
      st.push(INSTR.find.replace("{channel}",c.channelName));
      st.push(INSTR.stats);
      st.push(wt+" Your \u201CStats for nerds\u201D frame count must be over: <span class=\"val\">"+firstFrames.toLocaleString()+"</span>");
      for(var w=2;w<=wc;w++){st.push("Rewatch by moving the timestamp back to the beginning. Total frame count must be over: <span class=\"val\">"+(reqSec*fps*w).toLocaleString()+"</span>");}
      if(INSTR.like)st.push(INSTR.like);
      if(INSTR.comment)st.push(INSTR.comment);
      if(c.proofQuestion){st.push("In the proof section, answer: <strong>\u201C"+c.proofQuestion+"\u201D</strong> \u2014 then upload screenshots as required.");}else{st.push(INSTR.proof);}
      var stH=st.map(function(s){return"<li>"+s+"</li>";}).join("");
      document.getElementById("content").innerHTML=
        '<div class="section"><span class="label">Search for one of these keywords on YouTube:</span><ul class="keywords">'+kwH+'</ul></div>'+
        '<div class="section"><span class="label">Look for this thumbnail in the search results:</span><div class="thumb-wrap"><img src="'+c.thumbnailUrl+'" alt="Video thumbnail" /></div><p class="channel-name">YT Channel: <strong>'+c.channelName+'</strong></p></div>'+
        '<div class="section"><span class="label">Instructions:</span><ol class="steps">'+stH+'</ol><div class="warning">\u26A0 If you watch less than '+wn+', you will not be paid.</div></div>'+
        '<p class="meta">'+(c.videoTitle||"")+' \u00B7 '+fmt(dSec)+'</p>';
    })(c);
  </script>
</body>
</html>
